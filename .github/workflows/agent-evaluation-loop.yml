name: Agent quality - validate, evaluate and improve

on:
  push:
    branches: [main]
    paths:
      - "src/agents/documentation-agent/**"
      - "src/contracts/**"
      - "src/tools/**"
      - "evals/datasets/**"
      - "evals/documentation_quality.py"
      - "evals/documentation-quality/**"
      - "evals/precision-recall*.json"
      - "tests/evals/test_documentation_quality.py"
      - "data/knowledge/**"
      - "infra/isolated-evaluation/**"
      - "pyproject.toml"
      - "tests/release/test_eval_loop.py"
      - "tests/release/test_sandbox_eval.py"
      - "tests/release/test_precision_recall.py"
      - ".github/workflows/agent-evaluation-loop.yml"
  pull_request:
    paths:
      - "src/agents/documentation-agent/**"
      - "src/contracts/**"
      - "src/tools/**"
      - "evals/datasets/**"
      - "evals/documentation_quality.py"
      - "evals/documentation-quality/**"
      - "evals/precision-recall*.json"
      - "tests/evals/test_documentation_quality.py"
      - "data/knowledge/**"
      - "infra/isolated-evaluation/**"
      - "pyproject.toml"
      - "tests/release/test_eval_loop.py"
      - "tests/release/test_sandbox_eval.py"
      - "tests/release/test_precision_recall.py"
      - ".github/workflows/agent-evaluation-loop.yml"
  workflow_dispatch:
    inputs:
      pipeline:
        description: "Independent paths: legacy assessments or paired scoring of pinned real wiki/code"
        type: choice
        options: [legacy_assessments, precision_recall]
        default: legacy_assessments
      publish_precomputed:
        description: "Paired path only: separately approved source-free Foundry code pass rates"
        type: boolean
        default: false
      evaluation_mode:
        description: "Explicit coverage; supplied-only is never a full-suite pass"
        type: choice
        options:
          - full_suite
          - supplied_sources_only
        default: full_suite

permissions:
  contents: read

concurrency:
  group: isolated-eval-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: 1. Validate code offline (no model calls)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      live_changed: ${{ steps.live-paths.outputs.changed }}
    steps:
      - name: Check out code without saved credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify push changes - offline only or live evaluation eligible
        id: live-paths
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: python
        run: |
          import os
          import subprocess
          from fnmatch import fnmatchcase

          patterns = (
              "src/agents/documentation-agent/**", "src/contracts/**", "src/tools/**",
              "evals/datasets/**", "data/knowledge/**", "infra/isolated-evaluation/**",
              "pyproject.toml", "tests/release/test_eval_loop.py",
              ".github/workflows/agent-evaluation-loop.yml",
          )
          before = os.environ["BEFORE"]
          changed = False
          if before and set(before) != {"0"}:
              paths = subprocess.check_output(
                  ["git", "diff", "--name-only", "-z", before, os.environ["AFTER"], "--"],
                  text=True,
              ).split("\0")
              changed = any(fnmatchcase(path, pattern) for path in paths for pattern in patterns)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed={str(changed).lower()}\n")
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime and offline check dependencies
        run: python -m pip install '.[agent,prompt,dev]'
      - name: Test loop safeguards and synthetic evaluation fixtures
        run: >-
          python -m pytest tests/release/test_eval_loop.py tests/release/test_sandbox_eval.py
          tests/release/test_precision_recall.py tests/agents/test_hosted_evaluation.py tests/evals -q
      - name: Lint evaluation code and tests
        run: >-
          python -m ruff check src/tools/eval_loop.py src/tools/sandbox_eval.py src/tools/ado_transport.py
          src/tools/precision_recall tests/release/test_precision_recall.py
          tests/release/test_eval_loop.py tests/release/test_sandbox_eval.py
          evals/documentation_quality.py tests/evals/test_documentation_quality.py
      - name: Check evaluation types
        run: >-
          python -m mypy src/tools/eval_loop.py src/tools/sandbox_eval.py src/tools/ado_transport.py
          src/tools/precision_recall evals/documentation_quality.py
        env:
          MYPYPATH: src
      - name: Explain stages and what offline success does not prove
        if: always()
        env:
          PYTHONPATH: src
          OFFLINE_OUTCOME: ${{ job.status }}
        run: python -m tools.workflow_summary --workflow loop

  isolated:
    name: 2. Evaluate and improve isolated candidate (approval required)
    needs: offline
    # Never give PR code (including same-repository PRs) cloud credentials.
    if: >-
      github.event_name != 'pull_request' &&
      inputs.pipeline != 'precision_recall' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.offline.outputs.live_changed == 'true')) &&
      github.ref == 'refs/heads/main' &&
      vars.EVAL_LOOP_ENABLED == 'true'
    environment: isolated-agent-evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact trusted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated evaluation dependencies
        run: python -m pip install '.[agent,prompt,dev]'
      - name: Require explicitly reviewed isolated configuration
        env:
          LOOP_CONFIG: ${{ vars.EVAL_LOOP_CONFIG }}
          EXPECTED_MODE: ${{ inputs.evaluation_mode || vars.EVAL_LOOP_MODE || 'full_suite' }}
        shell: python
        run: |
          import os
          from pathlib import Path
          from tools.eval_loop import LoopConfig, runtime_settings
          value = LoopConfig.model_validate_json(os.environ["LOOP_CONFIG"])
          assert value.mode == os.environ["EXPECTED_MODE"], "Requested coverage differs from approved config"
          runtime_settings(value)
          Path("loop-config.json").write_text(value.model_dump_json(), encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Selected evaluation mode: **{value.mode}**\n\n")
              if value.mode == "supplied_sources_only":
                  summary.write("Partial coverage only. Excluded: order-sync-retry, "
                                "order-sync-information-missing. Tool-call accuracy not evaluated.\n\n")
      - name: Sign in to Azure with approved environment identity (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run inference, source checks, semantic judging and bounded improvements
        env:
          EVAL_LOOP_APPROVED: "true"
        run: >-
          timeout --signal=TERM --kill-after=10s 50m
          python -m tools.eval_loop --config loop-config.json
          --output evals/results/isolated-loop --execute-approved-isolated
      - name: Report interrupted or unconfigured evaluation
        if: always()
        shell: bash
        run: |
          if ! test -f evals/results/isolated-loop/summary.md; then
            echo '## Isolated evaluation loop' >> "$GITHUB_STEP_SUMMARY"
            echo 'No completed gate result: setup failed or execution was interrupted. No promotion.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain approved restricted diagnostics
        if: always() && vars.EVAL_LOOP_ARTIFACTS_APPROVED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: isolated-eval-${{ inputs.evaluation_mode || vars.EVAL_LOOP_MODE || 'full_suite' }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evals/results/isolated-loop/
          retention-days: 3
          if-no-files-found: warn

  precision-recall:
    name: 2. Paired pinned wiki/code measurement (not agent replay or release gate)
    needs: offline
    # No PR credentials, implicit pushes, personal login, or legacy-loop substitution.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.pipeline == 'precision_recall' &&
      github.ref == 'refs/heads/main' &&
      vars.EVAL_LOOP_ENABLED == 'true' &&
      vars.PRECISION_RECALL_ENABLED == 'true'
    environment: isolated-agent-evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted source without saved credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install existing evaluation dependencies
        run: python -m pip install '.[prompt,dev]'
      - name: Validate approved real manifest and exact execution bounds before login
        env:
          PAIRED_MANIFEST: ${{ vars.PRECISION_RECALL_MANIFEST }}
          PAIRED_CONFIG: ${{ vars.PRECISION_RECALL_CONFIG }}
        shell: python
        run: |
          import os
          from pathlib import Path
          from tools.precision_recall.models import Manifest, Config
          from tools.precision_recall.sources import private_json
          try:
              manifest = Manifest.model_validate_json(os.environ["PAIRED_MANIFEST"])
              config = Config.model_validate_json(os.environ["PAIRED_CONFIG"])
              assert manifest.read_identity.mode == config.model_identity.mode == "application"
              # This job has one OIDC login; require both reviewed identities to match it.
              assert manifest.read_identity == config.model_identity
              Path("evals/results/paired").mkdir(parents=True, mode=0o700)
              private_json(Path("evals/results/paired/manifest.json"), manifest.model_dump(mode="json"))
              private_json(Path("evals/results/paired/config.json"), config.model_dump(mode="json"))
          except Exception as exc:
              # Pydantic/SDK errors can include the source-bearing manifest.
              raise SystemExit("Paired configuration blocked: " + type(exc).__name__) from None
      - name: Sign in with approved environment application identity (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Discover and cache complete pinned declared code trees and wiki page (GET only)
        env:
          SANDBOX_READ_APPROVED: "true"
        run: >-
          timeout --signal=TERM --kill-after=10s 15m
          python -m tools.precision_recall capture
          --manifest evals/results/paired/manifest.json --config evals/results/paired/config.json
          --cache evals/results/paired/source-cache --output evals/results/paired/capture.json
          --capture-approved-readonly
      - name: Extract claims then run both verifier chains with fixed engineer facts
        env:
          EVAL_LOOP_APPROVED: "true"
        run: >-
          timeout --signal=TERM --kill-after=10s 30m
          python -m tools.precision_recall run
          --manifest evals/results/paired/manifest.json --config evals/results/paired/config.json
          --capture evals/results/paired/capture.json --cache evals/results/paired/extraction-cache
          --output evals/results/paired/run --execute-approved-isolated
      - name: Publish approved source-free projections to Foundry (not new LLM judging)
        if: inputs.publish_precomputed && vars.PRECISION_RECALL_PUBLICATION_APPROVED == 'true'
        env:
          PRECISION_RECALL_PUBLICATION_APPROVED: "true"
        run: >-
          timeout --signal=TERM --kill-after=10s 12m
          python -m tools.precision_recall publish
          --manifest evals/results/paired/manifest.json --config evals/results/paired/config.json
          --run evals/results/paired/run --output evals/results/paired/foundry
          --run-id gh-${{ github.run_id }}-${{ github.run_attempt }} --publish-approved-sanitized
      - name: Report paired measurement state without a semantic release gate
        if: always()
        run: >-
          python -m tools.workflow_summary --workflow precision-recall
          --decision evals/results/paired/run/precision_recall_summary.json
      - name: Retain source-bearing outputs only after explicit artifact/access approval
        if: always() && vars.EVAL_LOOP_ARTIFACTS_APPROVED == 'true' && vars.PRECISION_RECALL_ARTIFACTS_APPROVED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: precision-recall-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evals/results/paired/run/
          retention-days: 3
          if-no-files-found: warn
