name: Hosted documentation-agent release preflight

on:
  workflow_dispatch:
    inputs:
      execute_approved_cloud:
        description: "Separately approved billable candidate creation and evaluation (never promotion)"
        type: boolean
        default: false
      plan_path:
        description: "Reviewed release-plan JSON committed on main; no secrets"
        type: string
        default: release-plan.json

permissions:
  contents: read

concurrency:
  group: documentation-agent-release
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install '.[agent,prompt,dev]'
      - run: python -m pytest tests/release tests/evals tests/tools tests/contracts tests/agents -q
      - run: python -m ruff check src/tools tests/release tests/tools
      - run: python -m mypy src/tools/cli.py src/tools/hosted.py src/tools/hosted_evaluation.py src/tools/hosted_release.py src/tools/release.py src/tools/release_sources.py
      - run: python -m contracts.generate_schema --check
      - name: Build Python runtime artifact without a container build or publication
        run: python -m pip wheel --no-deps --wheel-dir dist .

  candidate-evaluation:
    needs: offline
    if: >-
      inputs.execute_approved_cloud &&
      github.ref == 'refs/heads/main' &&
      vars.P3_RELEASE_ENABLED == 'true'
    environment: p3-agent-release
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    env:
      PLAN_PATH: ${{ inputs.plan_path }}
      EVAL_MODEL_DEPLOYMENT: ${{ vars.EVAL_MODEL_DEPLOYMENT }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install '.[agent,prompt,dev]'
      - name: Fail before login on missing local prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EVAL_MODEL_DEPLOYMENT"
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
          python -c 'import os; from pathlib import Path; from tools.hosted_release import HostedReleasePlan; p=Path(os.environ["PLAN_PATH"]).resolve(); assert p.is_relative_to(Path.cwd()), "Plan must be in trusted checkout"; HostedReleasePlan.model_validate_json(p.read_text())'
      - name: Validate reviewed isolated evaluation plan locally before Azure login
        # Local success never certifies cloud/version/identity/evaluator readiness.
        run: python -m tools.release --plan "$PLAN_PATH" --output evals/results/preflight --preflight-only
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Guarded isolated hosted candidate evaluation; never promote
        run: python -m tools.release --plan "$PLAN_PATH" --output evals/results/release --execute-approved-cloud
      - name: Publish gate decision and scores (no source content) to the job summary
        if: always()
        shell: python
        run: |
          import glob, json, os
          from pathlib import Path
          out = ["## Eval gate"]
          d = Path("evals/results/release/decision.json")
          if d.exists():
              dec = json.loads(d.read_text(encoding="utf-8"))
              out.append(f"**{dec.get('status')}** — candidate v{dec.get('candidate_version')}, "
                         f"serving v{dec.get('serving_version')}, promoted={dec.get('promoted')}, "
                         f"thresholds={dec.get('thresholds')}")
          else:
              out.append("No decision was written; see the step logs.")
          rows = []
          for f in sorted(glob.glob("evals/results/release/*-scores.json")):
              for item in json.loads(Path(f).read_text(encoding="utf-8")):
                  case = (item.get("datasource_item") or {}).get("case_id")
                  res = {r.get("name"): r for r in item.get("results", [])}
                  cell = lambda n: (f"{res[n].get('score')} {'✅' if res[n].get('passed') else '❌'}" if n in res else "–")
                  rows.append(f"| {case} | {cell('groundedness')} | {cell('task_adherence')} | {cell('tool_call_accuracy')} |")
          if rows:
              out += ["", "| Case | Groundedness | Task adherence | Tool-call accuracy |", "|---|---|---|---|", *rows]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("\n".join(out) + "\n")
      - name: Retain restricted diagnostic artifacts, including blocked decisions
        if: always() && vars.P3_ARTIFACT_PUBLICATION_APPROVED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hosted-agent-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: evals/results/
          retention-days: 3
          if-no-files-found: warn
