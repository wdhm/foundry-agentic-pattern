name: Agent release - offline preflight and optional candidate evaluation

on:
  workflow_dispatch:
    inputs:
      execute_approved_cloud:
        description: "Separately approved billable candidate creation and evaluation (never promotion)"
        type: boolean
        default: false
      plan_path:
        description: "Reviewed release-plan JSON committed on main; no secrets"
        type: string
        default: release-plan.json

permissions:
  contents: read

concurrency:
  group: documentation-agent-release
  cancel-in-progress: false

jobs:
  offline:
    name: 1. Validate and package locally (no cloud calls)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code without saved credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime and offline check dependencies
        run: python -m pip install '.[agent,prompt,dev]'
      - name: Test contracts, runtime and release safeguards offline
        run: python -m pytest tests/release tests/evals tests/tools tests/contracts tests/agents -q
      - name: Lint release tooling and tests
        run: python -m ruff check src/tools tests/release tests/tools
      - name: Check release tooling types
        run: python -m mypy src/tools/cli.py src/tools/hosted.py src/tools/hosted_evaluation.py src/tools/hosted_release.py src/tools/release.py src/tools/release_sources.py
      - name: Verify generated contracts match committed schemas
        run: python -m contracts.generate_schema --check
      - name: Build Python runtime artifact without a container build or publication
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Explain stages and what offline success does not prove
        if: always()
        env:
          PYTHONPATH: src
          OFFLINE_OUTCOME: ${{ job.status }}
        run: python -m tools.workflow_summary --workflow release

  candidate-evaluation:
    name: 2. Evaluate hosted candidate (manual opt-in, never promote)
    needs: offline
    if: >-
      inputs.execute_approved_cloud &&
      github.ref == 'refs/heads/main' &&
      vars.P3_RELEASE_ENABLED == 'true'
    environment: p3-agent-release
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    env:
      PLAN_PATH: ${{ inputs.plan_path }}
      EVAL_MODEL_DEPLOYMENT: ${{ vars.EVAL_MODEL_DEPLOYMENT }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Check out the exact trusted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install hosted evaluation dependencies
        run: python -m pip install '.[agent,prompt,dev]'
      - name: Fail before login on missing local prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EVAL_MODEL_DEPLOYMENT"
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
          python -c 'import os; from pathlib import Path; from tools.hosted_release import HostedReleasePlan; p=Path(os.environ["PLAN_PATH"]).resolve(); assert p.is_relative_to(Path.cwd()), "Plan must be in trusted checkout"; HostedReleasePlan.model_validate_json(p.read_text())'
      - name: Validate reviewed isolated evaluation plan locally before Azure login
        # Local success never certifies cloud/version/identity/evaluator readiness.
        run: python -m tools.release --plan "$PLAN_PATH" --output evals/results/preflight --preflight-only
      - name: Sign in to Azure with approved environment identity (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run hosted candidate inference, source validation and semantic gate
        run: python -m tools.release --plan "$PLAN_PATH" --output evals/results/release --execute-approved-cloud
      - name: Explain sanitized gate decision (no source or model content)
        if: always()
        env:
          PYTHONPATH: src
        run: python -m tools.workflow_summary --workflow release --decision evals/results/release/decision.json
      - name: Retain restricted diagnostic artifacts, including blocked decisions
        if: always() && vars.P3_ARTIFACT_PUBLICATION_APPROVED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hosted-agent-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: evals/results/
          retention-days: 3
          if-no-files-found: warn
