[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-agentic-pattern"
version = "0.8.1"
description = "Shared contracts for the Foundry agentic reference pattern"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
prompt = [
  "azure-ai-projects>=2.3,<3",
  "azure-identity>=1.26,<2",
]
agent = [
  "jsonschema>=4.23,<5",
  "agent-framework-core==1.19.0",
  "agent-framework-foundry==1.13.1",
  "agent-framework-foundry-hosting==1.0.0b260918",
  "azure-ai-agentserver-core==2.2.0",
  "azure-ai-agentserver-responses==2.3.0b2",
  "azure-ai-agentserver-invocations==1.2.0",
  "azure-ai-agentserver-activity==1.0.0b4",
]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
generate-contract-schemas = "contracts.generate_schema:main"
documentation-agent = "documentation_agent.main:main"
documentation-prompt = "contracts.prompt:main"
documentation-trigger = "tools.cli:main"
documentation-code-eval = "tools.code_eval:main"
documentation-precision-recall = "tools.precision_recall.__main__:main"

[tool.setuptools]
packages = ["contracts", "documentation_agent", "tools", "tools.precision_recall"]

[tool.setuptools.package-dir]
contracts = "src/contracts"
documentation_agent = "src/agents/documentation-agent/app"
tools = "src/tools"

[tool.setuptools.package-data]
contracts = ["schema/*.json", "schema/v1/*.json", "schema/evaluation/*.json", "py.typed"]
documentation_agent = ["py.typed", "prompts/*.txt", "policies/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = [
  "src/contracts",
  "src/agents/documentation-agent/app",
  "src/agents/documentation-prompt/configure.py",
  "src/tools/cli.py",
]

[[tool.mypy.overrides]]
module = ["agent_framework_foundry_hosting", "jsonschema"]
ignore_missing_imports = true
