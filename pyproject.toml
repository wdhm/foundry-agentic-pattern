[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-agentic-pattern"
version = "0.1.0"
description = "Shared contracts for the Foundry agentic reference pattern"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
agent = [
  "agent-framework-core==1.19.0",
  "agent-framework-foundry-hosting==1.0.0b260918",
]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
generate-contract-schemas = "contracts.generate_schema:main"
documentation-agent = "documentation_agent.main:main"

[tool.setuptools]
packages = ["contracts", "documentation_agent"]

[tool.setuptools.package-dir]
contracts = "src/contracts"
documentation_agent = "src/agents/documentation-agent/app"

[tool.setuptools.package-data]
contracts = ["schema/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/contracts", "src/agents/documentation-agent/app"]

[[tool.mypy.overrides]]
module = ["agent_framework_foundry_hosting"]
ignore_missing_imports = true
